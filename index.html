<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="Levels of Dungeons – Minecraft und mehr.">
  <title>Levels of Dungeons</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f5f2f8; background: #10131b; }
    main { width: min(100% - 32px, 620px); padding: 56px 28px; text-align: center; border: 1px solid #292532; border-radius: 20px; background: linear-gradient(145deg, #171521, #11141c); box-shadow: 0 24px 70px rgb(0 0 0 / 28%); }
    p { margin: 12px 0 28px; color: #a8a2b0; }
    a { display: inline-block; padding: 11px 16px; color: #fff; border: 1px solid #9f52bc; border-radius: 9px; background: linear-gradient(135deg, #ad5ac7, #7146b8); text-decoration: none; font-weight: 700; }
    a:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <main>
    <h1>Levels of Dungeons</h1>
    <p>Willkommen auf levelsofdungeons.de.</p>
    <a href="/ntab-stu/">NeoTab Studio öffnen</a>
  </main>
</body>
</html>
